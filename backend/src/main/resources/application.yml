spring:
  application:
    name: sketchtrench-backend

  # ---- Database ----------------------------------------------------------
  # Every value falls back to a local-dev default but is overridable via env vars
  # (Docker Compose, Render, Railway, etc.). NEVER hardcode real credentials.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sketchtrench}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}

  # ---- JPA / Hibernate ---------------------------------------------------
  jpa:
    # Flyway owns the schema. Hibernate must NEVER auto-create/alter tables
    # (ddl-auto=create/update causes silent schema drift in production).
    # `validate` fails startup if entities don't match the migrated schema,
    # catching mapping bugs early instead of at 2am in production.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.format_sql: true

  # ---- Flyway ------------------------------------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration

  # ---- JSON --------------------------------------------------------------
  jackson:
    time-zone: UTC

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

# ---- Application-specific settings (bound by @ConfigurationProperties) ----
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-do-not-use-in-prod-please-change-me-0123456789abcdef}
    access-token-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TTL:7d}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.sketchtrench: DEBUG

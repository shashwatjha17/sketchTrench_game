name: Keep backend warm

# Render's free tier puts the backend to sleep after ~15 min without traffic, and waking it
# takes 30-60s — which is what a first-time visitor (or a recruiter) would sit through.
# Pinging the health endpoint every 10 minutes keeps it awake. GitHub may delay scheduled
# runs by a few minutes, and pauses schedules after 60 days with no repo activity.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /actuator/health
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 90 https://sketchtrench-backend.onrender.com/actuator/health; then exit 0; fi
            sleep 10
          done
          echo "Backend did not respond" && exit 1

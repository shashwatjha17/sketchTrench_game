# Full SketchTrench stack: PostgreSQL, Redis, Spring Boot backend, nginx-served frontend.
#
# Usage:  docker compose up -d --build
#   Frontend: http://localhost:8081   API + WS proxied through nginx to the backend.
#
# For local day-to-day dev you only need postgres + redis (or Homebrew equivalents);
# the app can run via `./mvnw spring-boot:run` and `npm run dev` without Docker.
services:
  postgres:
    image: postgres:17-alpine
    container_name: sketchtrench-postgres
    environment:
      POSTGRES_DB: sketchtrench
      POSTGRES_USER: sketchtrench
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sketchtrench}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sketchtrench -d sketchtrench"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sketchtrench-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: sketchtrench-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/sketchtrench
      DB_USERNAME: sketchtrench
      DB_PASSWORD: ${DB_PASSWORD:-sketchtrench}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-do-not-use-in-prod-please-change-me-0123456789abcdef}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: sketchtrench-frontend
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  pgdata:
  redisdata:
